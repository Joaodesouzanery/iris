<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRIS Platform - Metricas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e4e4e4;
        }
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 1.8em;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header nav a {
            color: #00d4ff;
            text-decoration: none;
            margin-left: 20px;
            padding: 8px 15px;
            border-radius: 20px;
            background: rgba(0,212,255,0.1);
            transition: all 0.3s;
        }
        .header nav a:hover { background: rgba(0,212,255,0.2); }
        .header nav a.active { background: rgba(192,132,252,0.3); color: #c084fc; }
        .container {
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .section-title {
            color: #00d4ff;
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .metric-card {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #00d4ff;
        }
        .metric-card h3 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .metric-card .value {
            font-size: 2.5em;
            font-weight: 700;
            color: #00d4ff;
        }
        .metric-card .value.green { color: #4ade80; }
        .metric-card .value.red { color: #f87171; }
        .metric-card .value.purple { color: #c084fc; }
        .metric-card .subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .chart-container {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chart-title {
            color: #00d4ff;
            font-size: 1em;
            margin-bottom: 15px;
        }
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bar-label {
            width: 120px;
            font-size: 13px;
            color: #888;
        }
        .bar-track {
            flex: 1;
            height: 24px;
            background: #0d1117;
            border-radius: 12px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #4ade80);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #000;
            min-width: 30px;
        }
        .bar-fill.red { background: linear-gradient(90deg, #f87171, #fbbf24); }
        .bar-fill.purple { background: linear-gradient(90deg, #c084fc, #a855f7); }
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .two-columns { grid-template-columns: 1fr; }
        }
        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #666;
        }
        .empty-state h2 { color: #00d4ff; margin-bottom: 20px; }
        .loading {
            text-align: center;
            padding: 60px;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .table-container {
            overflow-x: auto;
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 40px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        td { font-size: 13px; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>IRIS Metricas</h1>
        <nav>
            <a href="/">Analise PDFs</a>
            <a href="/metricas" class="active">Metricas</a>
        </nav>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading"></div>
        </div>
    </div>

    <script>
        async function carregarMetricas() {
            try {
                const [resumo, porDiretor, porTema, institucional] = await Promise.all([
                    fetch('/api/metricas/resumo').then(r => r.json()),
                    fetch('/api/metricas/por-diretor').then(r => r.json()),
                    fetch('/api/metricas/por-tema').then(r => r.json()),
                    fetch('/api/metricas/institucional').then(r => r.json())
                ]);

                renderMetricas(resumo, porDiretor, porTema, institucional);
            } catch (e) {
                document.getElementById('content').innerHTML =
                    '<div class="empty-state"><p>Erro ao carregar metricas: ' + e.message + '</p></div>';
            }
        }

        function renderMetricas(resumo, porDiretor, porTema, institucional) {
            if (resumo.totalDeliberacoes === 0) {
                document.getElementById('content').innerHTML =
                    '<div class="empty-state">' +
                    '<h2>Nenhuma deliberacao analisada</h2>' +
                    '<p>Faca upload de PDFs e analise-os para ver as metricas.</p>' +
                    '<a href="/" class="btn" style="display: inline-block; margin-top: 20px; text-decoration: none;">Ir para Analise</a>' +
                    '</div>';
                return;
            }

            var html = '';

            // SEÇÃO 1: MÉTRICAS DE VALOR REGULATÓRIO
            html += '<h2 class="section-title">Metricas de Valor Regulatorio</h2>';
            html += '<div class="cards-grid">';
            html += '<div class="metric-card"><h3>Deliberacoes Processadas</h3><div class="value">' + resumo.totalDeliberacoes + '</div></div>';
            html += '<div class="metric-card"><h3>PDFs Analisados</h3><div class="value">' + resumo.pdfsAnalisados + '</div><div class="subtitle">de ' + resumo.totalPdfs + ' carregados</div></div>';
            html += '<div class="metric-card"><h3>% Classificadas</h3><div class="value green">' + resumo.percentualClassificado + '%</div></div>';
            html += '<div class="metric-card"><h3>Microtemas</h3><div class="value purple">' + resumo.microtemasIdentificados + '</div></div>';
            html += '<div class="metric-card"><h3>Deferidos</h3><div class="value green">' + resumo.deferidos + '</div><div class="subtitle">' + resumo.taxaDeferimento + '% do total</div></div>';
            html += '<div class="metric-card"><h3>Indeferidos</h3><div class="value red">' + resumo.indeferidos + '</div></div>';
            html += '<div class="metric-card"><h3>Diretores Mapeados</h3><div class="value">' + resumo.diretoresMapeados + '</div></div>';
            html += '<div class="metric-card"><h3>Pauta Externa</h3><div class="value">' + resumo.pautaExterna + '</div><div class="subtitle">pleitos de terceiros</div></div>';
            html += '</div>';

            // SEÇÃO 2: GRÁFICOS
            var totalDecisoes = resumo.deferidos + resumo.indeferidos;
            var pctDeferido = totalDecisoes > 0 ? Math.round((resumo.deferidos / totalDecisoes) * 100) : 0;

            html += '<div class="two-columns">';
            html += '<div class="chart-container">';
            html += '<div class="chart-title">Resultado das Deliberacoes</div>';
            html += '<div class="bar-chart">';
            html += '<div class="bar-item"><span class="bar-label">Deferidos</span><div class="bar-track"><div class="bar-fill" style="width: ' + pctDeferido + '%">' + resumo.deferidos + '</div></div></div>';
            html += '<div class="bar-item"><span class="bar-label">Indeferidos</span><div class="bar-track"><div class="bar-fill red" style="width: ' + (100 - pctDeferido) + '%">' + resumo.indeferidos + '</div></div></div>';
            html += '</div></div>';

            html += '<div class="chart-container">';
            html += '<div class="chart-title">Pauta Interna vs Externa</div>';
            html += '<div class="bar-chart">';
            html += '<div class="bar-item"><span class="bar-label">Pauta Externa</span><div class="bar-track"><div class="bar-fill" style="width: ' + institucional.percentualPautaExterna + '%">' + institucional.pautaExterna + '</div></div></div>';
            html += '<div class="bar-item"><span class="bar-label">Pauta Interna</span><div class="bar-track"><div class="bar-fill purple" style="width: ' + institucional.percentualPautaInterna + '%">' + institucional.pautaInterna + '</div></div></div>';
            html += '</div></div>';
            html += '</div>';

            // SEÇÃO 3: MÉTRICAS POR TEMA
            html += '<h2 class="section-title">Metricas por Tema</h2>';
            html += '<div class="chart-container">';
            html += '<div class="chart-title">Temas Mais Recorrentes</div>';
            html += '<div class="bar-chart">';
            var maxTema = porTema.temas[0] ? porTema.temas[0].total : 1;
            porTema.temas.slice(0, 8).forEach(function(t) {
                var pct = Math.round((t.total / maxTema) * 100);
                html += '<div class="bar-item"><span class="bar-label">' + t.tema + '</span><div class="bar-track"><div class="bar-fill" style="width: ' + pct + '%">' + t.total + ' (' + t.taxaDeferimento + '% def)</div></div></div>';
            });
            html += '</div></div>';

            // Cards de tema destaque
            if (porTema.temaMaisDeferido || porTema.temaMaisIndeferido) {
                html += '<div class="cards-grid" style="grid-template-columns: repeat(2, 1fr);">';
                if (porTema.temaMaisDeferido) {
                    html += '<div class="metric-card" style="border-left-color: #4ade80;"><h3>Tema com Mais Deferimento</h3><div class="value green">' + porTema.temaMaisDeferido.tema + '</div><div class="subtitle">' + porTema.temaMaisDeferido.taxaDeferimento + '% de deferimento</div></div>';
                }
                if (porTema.temaMaisIndeferido) {
                    html += '<div class="metric-card" style="border-left-color: #f87171;"><h3>Tema com Mais Indeferimento</h3><div class="value red">' + porTema.temaMaisIndeferido.tema + '</div><div class="subtitle">' + porTema.temaMaisIndeferido.taxaIndeferimento + '% de indeferimento</div></div>';
                }
                html += '</div>';
            }

            // SEÇÃO 4: MÉTRICAS POR DIRETOR
            html += '<h2 class="section-title">Metricas por Diretor</h2>';
            if (porDiretor.diretores.length === 0) {
                html += '<div class="empty-state"><p>Nenhum diretor identificado nas deliberacoes</p></div>';
            } else {
                html += '<div class="table-container"><table>';
                html += '<thead><tr><th>Diretor</th><th>Total Votos</th><th>A Favor</th><th>Contra</th><th>% Pleito Externo</th><th>Taxa Deferimento</th><th>Top Temas</th></tr></thead>';
                html += '<tbody>';
                porDiretor.diretores.forEach(function(d) {
                    var topTemas = d.temasOrdenados.slice(0, 3).map(function(t) { return t.tema; }).join(', ');
                    html += '<tr>';
                    html += '<td style="color: #00d4ff; font-weight: 600;">' + d.nome + '</td>';
                    html += '<td>' + d.totalVotos + '</td>';
                    html += '<td style="color: #4ade80;">' + d.votosFavor + '</td>';
                    html += '<td style="color: #f87171;">' + d.votosContra + '</td>';
                    html += '<td>' + d.percentualPleitoExterno + '%</td>';
                    html += '<td>' + d.taxaDeferimento + '%</td>';
                    html += '<td style="color: #888; font-size: 11px;">' + (topTemas || '-') + '</td>';
                    html += '</tr>';
                });
                html += '</tbody></table></div>';
            }

            // SEÇÃO 5: MÉTRICAS INSTITUCIONAIS
            html += '<h2 class="section-title">Metricas Institucionais</h2>';
            html += '<div class="cards-grid" style="grid-template-columns: repeat(4, 1fr);">';
            html += '<div class="metric-card"><h3>Total Reunioes</h3><div class="value">' + institucional.totalReunioes + '</div></div>';
            html += '<div class="metric-card"><h3>Deliberacoes</h3><div class="value">' + institucional.totalDeliberacoes + '</div></div>';
            html += '<div class="metric-card"><h3>% Pauta Externa</h3><div class="value green">' + institucional.percentualPautaExterna + '%</div></div>';
            html += '<div class="metric-card"><h3>% Pauta Interna</h3><div class="value purple">' + institucional.percentualPautaInterna + '%</div></div>';
            html += '</div>';

            // Botão de exportar
            html += '<div style="text-align: center; margin-top: 40px;">';
            html += '<button class="btn" onclick="exportarDados()">Exportar Dados (JSON)</button>';
            html += '</div>';

            document.getElementById('content').innerHTML = html;
        }

        async function exportarDados() {
            var res = await fetch('/api/metricas/exportar');
            var data = await res.json();
            var json = JSON.stringify(data, null, 2);
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'iris_metricas_' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        carregarMetricas();
    </script>
</body>
</html>
